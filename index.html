<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<title>Rekap Kerja</title>
<style>
  :root{
    --bg:#f2f5fb;--card:#ffffff;--tx:#131a2b;--mut:#667089;--line:#e4e9f3;--inp:#ffffff;
    --pri:#1d4ba3;--pri2:#0b2a5b;--btn:#1d4ba3;--acc:#d4a82a;--ok:#12805c;--bad:#c0362c;--warn:#b7791f;
    --soft:#eaf0fc;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);--r:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0c111f;--card:#151c2f;--tx:#e9edf7;--mut:#97a3bd;--line:#232e48;--inp:#0f1626;--pri:#7ea6ff;--soft:#1b2745;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  button,input,select,textarea{font-family:inherit;color:inherit}
  svg{flex:none}

  /* ---------- Masuk / Daftar ---------- */
  #auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 40px;background:var(--bg)}
  .auth-hero{width:calc(100% + 32px);margin:0 -16px;background:linear-gradient(155deg,#0b2a5b 0%,#1d4ba3 65%,#3a74da 100%);color:#fff;text-align:center;padding:54px 20px 86px;border-radius:0 0 34px 34px}
  .logo{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:36px;backdrop-filter:blur(6px)}
  .auth-hero h1{margin:0;font-size:26px;letter-spacing:.2px}
  .auth-hero p{margin:6px 0 0;opacity:.82;font-size:14px}
  .auth-card{width:100%;max-width:430px;margin-top:-52px;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 22px 50px rgba(8,20,50,.25);border:1px solid var(--line)}
  .seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:4px}
  .seg button{flex:1;border:0;background:transparent;padding:11px;border-radius:11px;font-weight:700;color:var(--mut);cursor:pointer;transition:.2s}
  .seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 6px rgba(0,0,0,.12)}

  /* ---------- Kerangka aplikasi ---------- */
  #app{min-height:100vh;min-height:100dvh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .top{background:linear-gradient(155deg,#0b2a5b 0%,#1d4ba3 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 64px;border-radius:0 0 28px 28px}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top small{opacity:.85;font-size:13.5px;display:block}
  .top h2{margin:2px 0 0;font-size:21px;letter-spacing:.1px}
  .avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
  .wrap{max-width:780px;margin:-44px auto 0;padding:0 14px;animation:naik .35s ease both}
  @keyframes naik{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line)}
  .nav button{flex:1;max-width:170px;min-height:54px;border:0;background:none;color:var(--mut);padding:7px 4px 5px;border-radius:14px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.2s}
  .nav button.on{color:var(--pri);background:var(--soft)}
  .fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;border:0;border-radius:999px;padding:13px 18px;background:var(--acc);color:#2a2100;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(180,140,20,.45);cursor:pointer;transition:.2s}
  .fab:active{transform:scale(.96)}
  @media (max-width:559px){.fab{width:56px;height:56px;padding:0;justify-content:center}.fab .fl{display:none}}
  .acts .btn:first-child{white-space:nowrap;min-width:0;overflow:hidden;justify-content:center;padding-left:10px;padding-right:10px}
  @media (max-width:359px){.acts .btn:first-child{font-size:13.5px;gap:6px}.acts .btn:first-child svg{width:16px;height:16px}}
  .acts .btn.ico{min-width:46px;min-height:46px}

  /* ---------- Komponen ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
  .card.flat{box-shadow:none}
  h3.sec{margin:20px 4px 10px;font-size:14px;color:var(--mut);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
  .stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
  .stat b{display:block;font-size:26px;line-height:1.1;color:var(--pri)}
  .stat span{font-size:13px;color:var(--mut)}
  .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--sh);transition:.15s;display:flex;flex-direction:column;gap:10px}
  .tile:active{transform:scale(.97)}
  .tile .ik{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
  .tile b{font-size:14.5px;display:block;line-height:1.25}
  .tile span{font-size:13px;color:var(--mut);display:block;line-height:1.3;margin-top:2px}

  .chips-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
  .chips-bar::-webkit-scrollbar{display:none}
  .fc{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .fc.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .bar{display:flex;gap:8px;margin-bottom:10px}

  .doc{position:relative;overflow:hidden;padding-left:20px}
  .doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--wr,var(--pri))}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--wr,var(--pri));background:var(--soft);background:color-mix(in srgb,var(--wr,var(--pri)) 13%,transparent)}
  .judul{font-weight:700;font-size:16px;margin:8px 0 4px;line-height:1.3;word-break:break-word}
  .meta{display:flex;align-items:flex-start;gap:6px;font-size:14px;color:var(--mut);margin:2px 0}
  .oleh{font-size:13px;color:var(--mut);margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--soft);color:var(--pri);font-size:13px;padding:3px 10px;border-radius:999px}
  .chip.Selesai{background:#e1f5ec;color:var(--ok)} .chip.Proses{background:#fdf1d6;color:var(--warn)} .chip.Tertunda,.chip.Dieskalasi{background:#fde6e3;color:var(--bad)}
  .chip.admin{background:#fff1c7;color:#876500}
  .isi{white-space:pre-wrap;font-size:14px;margin:8px 0;word-break:break-word}
  .catatan{background:#fff6dc;background:color-mix(in srgb,var(--acc) 14%,transparent);border-left:3px solid var(--acc);padding:9px 11px;font-size:14px;white-space:pre-wrap;border-radius:8px;margin:8px 0}
  .acts{display:flex;gap:8px;margin-top:14px}
  .acts .btn:first-child{flex:1}

  .btn{border:0;background:var(--btn);color:#fff;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.6;cursor:wait}
  .btn.sm{padding:9px 13px;font-size:13.5px;border-radius:12px}
  .btn.alt{background:var(--card);color:var(--pri);border:1px solid var(--line)}
  .btn.ghost{background:var(--soft);color:var(--pri)}
  .btn.gold{background:var(--acc);color:#2a2100}
  .btn.danger{background:var(--card);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line))}
  .btn.wa{background:#1faa59}
  .btn.blok{width:100%;margin-top:16px;padding:14px;font-size:16px}
  .btn.ico{padding:9px 11px}

  label{display:block;font-size:14px;font-weight:700;color:var(--mut);margin:15px 0 6px}
  label i{color:var(--bad);font-style:normal}
  input,select,textarea{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--line);border-radius:13px;background:var(--inp);transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
  textarea{min-height:96px;resize:vertical;line-height:1.45}
  .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
  .g2>*{min-width:0}
  input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;min-height:48px;min-width:0;display:block;text-align:left;line-height:1.2}
  input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
  input,select{min-height:48px}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button{touch-action:manipulation}
  @media (max-width:359px){.g2{grid-template-columns:minmax(0,1fr)}.tile{padding:12px}}

  .aibtn{margin-top:8px;color:var(--pri);gap:6px}
  .pw{position:relative}.pw input{padding-right:50px}
  .pw .mata{position:absolute;right:4px;top:0;bottom:0;width:46px;border:0;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .card.doc{cursor:pointer}
  .dt{margin:0 0 12px}.dt .k{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 3px}.dt .v{font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .dt .v.kosong2{color:var(--mut)}
  .dt .rows div{padding:8px 0;border-top:1px solid var(--line)}.dt .rows div:first-child{border-top:0}
  .dt .rows small{display:block;color:var(--mut);font-size:13px}
  .dt .galeri2{display:flex;flex-direction:column;gap:10px}.dt .galeri2 img{width:100%;border-radius:14px;border:1px solid var(--line)}
  .hint{font-size:13px;color:var(--mut);margin-top:5px}
  .pesan{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
  .pesan.gagal{background:#fde6e3;color:var(--bad)} .pesan.ok{background:#e1f5ec;color:var(--ok)}
  .kosong{text-align:center;color:var(--mut);padding:34px 12px}
  .kosong svg{opacity:.5;margin-bottom:8px}
  .skel{height:112px;border-radius:var(--r);margin-bottom:12px;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 50%,transparent) 50%,var(--line) 75%);background-size:200% 100%;animation:kilau 1.2s infinite}
  @keyframes kilau{to{background-position:-200% 0}}

  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .thumbs div{position:relative}
  .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .thumbs button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:14px;line-height:1;cursor:pointer}
  .row{display:flex;gap:8px}
  .tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{background:var(--soft);color:var(--pri);padding:6px 7px 6px 13px;border-radius:999px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
  .tag button{border:0;min-width:24px;height:24px;background:color-mix(in srgb,var(--pri) 25%,transparent);color:var(--pri);width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1}
  .box{border:1px solid var(--line);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
  .box .g2{margin-top:8px}
  .ck{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
  .ck .row{margin-top:8px}
  .galeri img{width:100%;border-radius:14px;margin-bottom:10px;border:1px solid var(--line)}

  /* ---------- Lembar bawah ---------- */
  #lembar{position:fixed;inset:0;background:rgba(7,14,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:pudar .2s ease both}
  @keyframes pudar{from{opacity:0}to{opacity:1}}
  .ls{background:var(--bg);width:100%;max-width:780px;max-height:93vh;overflow:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:0 14px calc(26px + env(safe-area-inset-bottom));animation:geser .28s cubic-bezier(.2,.8,.2,1) both}
  @keyframes geser{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .ls-h{position:sticky;top:0;background:var(--bg);z-index:3;padding:10px 2px 8px}
  .ls-h .grip{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
  .ls-h div.t{display:flex;align-items:center;justify-content:space-between}
  .ls-h h3{margin:0;font-size:18px}
  .x{border:0;background:var(--soft);color:var(--pri);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mi{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .mi:active{transform:scale(.985)}
  a.mi,a.btn{text-decoration:none;color:inherit} a.btn{color:#fff} a.btn.wa{color:#fff}
  .mi .ik{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .mi b{display:block;font-size:15.5px} .mi span{font-size:13.5px;color:var(--mut)}
  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:80;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:p .8s linear infinite;display:inline-block}
  .spin.g{border-color:color-mix(in srgb,var(--pri) 30%,transparent);border-top-color:var(--pri)}
  @keyframes p{to{transform:rotate(360deg)}}
  .cb{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin:0 0 8px;background:var(--card);font-weight:600;font-size:14px;color:var(--tx);cursor:pointer}
  .cb input{width:20px;height:20px;flex:none;padding:0}
  .banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff6dc;background:color-mix(in srgb,var(--acc) 16%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));padding:10px 12px;border-radius:14px;font-size:14px;margin-bottom:10px}
  @media (min-width:700px){.menu{grid-template-columns:repeat(3,1fr)} #lembar{align-items:center}.ls{border-radius:26px;max-height:88vh}}
</style>
</head>
<body>

<!-- ============ MASUK / DAFTAR ============ -->
<div id="auth" class="hidden">
  <div class="auth-hero"><div class="logo">🛂</div><h1>Rekap Kerja</h1><p>Kegiatan harian &amp; laporan kantor dalam satu aplikasi</p></div>
  <div class="auth-card">
    <div class="seg">
      <button id="segMasuk" class="on" data-aksi="segAuth" data-t="masuk">Masuk</button>
      <button id="segDaftar" data-aksi="segAuth" data-t="daftar">Daftar</button>
    </div>
    <div id="formMasuk">
      <label>Username</label><input id="lUser" autocapitalize="none" autocomplete="username">
      <label>Password</label><input id="lPass" type="password" autocomplete="current-password">
      <button class="btn blok" id="btnMasuk" data-aksi="masuk">Masuk</button>
    </div>
    <div id="formDaftar" class="hidden">
      <label>Nama lengkap <i>*</i></label><input id="rNama" autocomplete="name">
      <div class="g2"><div><label>NIP</label><input id="rNip" inputmode="numeric"></div><div><label>Jabatan</label><input id="rJab" placeholder="mis. Pemeriksa Pemula"></div></div>
      <label>Username <i>*</i></label><input id="rUser" autocapitalize="none" placeholder="huruf kecil / angka">
      <label>Password <i>*</i> (min. 6 karakter)</label><input id="rPass" type="password" autocomplete="new-password">
      <label>Kode pendaftaran</label><input id="rKode" autocapitalize="characters" placeholder="Minta ke admin kantor">
      <div class="hint">Pengguna pertama otomatis jadi admin dan boleh mengosongkan kode.</div>
      <button class="btn blok" id="btnDaftar" data-aksi="daftar">Buat akun</button>
    </div>
    <div class="pesan gagal hidden" id="pesanAuth"></div>
  </div>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app" class="hidden">
  <div class="top">
    <div class="top-row">
      <div><small id="subHal"></small><h2 id="judulHal"></h2></div>
      <div class="avatar" id="avatar">?</div>
    </div>
    <div id="verBar" style="margin-top:10px"></div>
  </div>
  <div class="wrap" id="isiHal"></div>
  <button class="fab hidden" id="fab" data-aksi="fab"></button>
  <div class="nav" id="nav"></div>
</div>

<div id="lembar" class="hidden"><div class="ls" id="ls"></div></div>
<div id="toast" class="hidden"></div>

<script>
/* ================= Dasar ================= */
var KLIEN_VERSI='3.5';
/* Diisi hanya kalau halaman ini dipasang di luar Apps Script (GitHub Pages). Isi dengan link /exec. */
var API_URL='https://script.google.com/macros/s/AKfycbyILneHDSPFhgmPHX3tFNfMV79hEpTToT07ZuLNmZtUYrVlHXBNGg1B7fUim9IeRl0/exec';
var S = { token:null, user:null, set:{}, nama:[], tab:'home', dok:{}, keg:{}, fJenis:'', dokBulan:null, kegBulan:null, hasil:null };
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

var ICON={
 home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
 clip:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',

function call(nama,args){
  return new Promise(function(res,rej){
    if(!(window.google&&google.script&&google.script.run)){
      if(!API_URL){ rej(new Error('API_URL belum diisi di Index.html')); return; }
      var coba=function(n){
        fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:nama,args:args})})
          .then(function(x){ if(!x.ok) throw new Error('HTTP '+x.status); return x.text(); })
          .then(function(t){ var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('Balasan server bukan JSON: '+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,160)); }
            if(j.ok){ res(j.hasil); return; }
            var m=String(j.error||'Gagal');
            if(m.indexOf('LOGIN')>=0){ keluarLokal(); rej(new Error('Sesi habis, silakan masuk lagi.')); return; }
            rej(new Error(m.replace(/^(Error|Exception):\s*/,'')));
          })
          .catch(function(e){
            if(n<1){ setTimeout(function(){ coba(n+1); },700); return; }
            rej(new Error('Gagal menghubungi server ('+nama+'): '+((e&&e.message)||e)));
          });
      };
      coba(0);
      return;
    }
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
      var m=String((e&&e.message)||e);
      if(m.indexOf('LOGIN')>=0){ keluarLokal(); rej(new Error('Sesi habis, silakan masuk lagi.')); return; }
      rej(new Error(m.replace(/^(Error|Exception):\s*/,'')));
    });
    if(typeof r[nama]!=='function'){ rej(new Error('Kode server belum diperbarui (fungsi "'+nama+'" tidak ada). Tempel Code.gs terbaru, jalankan mulaiPertama, lalu Deploy > New version.')); return; }
    r[nama].apply(r,args);
  });
}
function api(nama){ return call(nama,[S.token].concat([].slice.call(arguments,1))); }

/* ---------- Foto ---------- */
function kompres(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var r=Math.min(1,1280/Math.max(img.width,img.height)), w=Math.round(img.width*r), h=Math.round(img.height*r);
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      var u=c.toDataURL('image/jpeg',0.78); URL.revokeObjectURL(url); res({data:u.split(',')[1],preview:u});
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Foto tidak bisa dibaca')); };
    img.src=url;
  });
}
function pemilihFoto(wadah,maks){
  var st={items:[]};
  wadah.innerHTML='<div class="row"><button type="button" class="btn alt sm" data-p="g">'+ic('img',17)+'Galeri</button><button type="button" class="btn alt sm" data-p="k">'+ic('cam',17)+'Kamera</button></div>'+
    '<input type="file" accept="image/*" multiple hidden class="pg"><input type="file" accept="image/*" capture="environment" hidden class="pk"><div class="thumbs"></div><div class="hint"></div>';
  var pg=wadah.querySelector('.pg'), pk=wadah.querySelector('.pk'), th=wadah.querySelector('.thumbs'), hint=wadah.querySelector('.hint');
  wadah.querySelector('[data-p="g"]').onclick=function(){ pg.click(); };
  wadah.querySelector('[data-p="k"]').onclick=function(){ pk.click(); };
  function gambar(){
    th.innerHTML='';
    st.items.forEach(function(f,i){
      var d=document.createElement('div'), im=document.createElement('img'), b=document.createElement('button');
      im.src=f.preview; b.type='button'; b.textContent='×'; b.onclick=function(){ st.items.splice(i,1); gambar(); };
      d.appendChild(im); d.appendChild(b); th.appendChild(d);
    });
    hint.textContent=st.items.length?st.items.length+' foto baru (maks '+maks+')':'';
  }
  async function baca(inp){
    for(var i=0;i<inp.files.length;i++){ if(st.items.length>=maks) break; try{ st.items.push(await kompres(inp.files[i])); }catch(e){} }
    inp.value=''; gambar();
  }
  pg.onchange=function(){ baca(pg); }; pk.onchange=function(){ baca(pk); };
  st.kirim=function(){ return st.items.map(function(f){ return {data:f.data}; }); };
  return st;
}
async function lihatFoto(ids){
  bukaLembar('Foto dokumentasi','<div class="galeri" id="gal"><div class="kosong"><span class="spin g"></span></div></div>');
  var g=$('gal'); g.innerHTML='';
  for(var i=0;i<ids.length;i++){
    try{ var im=document.createElement('img'); im.src=await api('ambilFoto',ids[i]); g.appendChild(im); }
    catch(e){ var p=document.createElement('div'); p.className='pesan gagal'; p.textContent='Foto '+(i+1)+' gagal dimuat: '+e.message; g.appendChild(p); }
  }
}

function adaIsi(d){
  var abaikan=['kepada','dari','tanggal','jam','jamMulai','jamSelesai','mengetahui','dampak','status','kategori'];
  for(var k in d){
    if(abaikan.indexOf(k)>=0) continue; var v=d[k];
    if(typeof v==='string'){ if(v.trim()) return true; }
    else if(Array.isArray(v)){ if(k==='petugas'){ if(v.length>1||(v.length===1&&v[0]!==S.user.nama)) return true; } else if(v.length) return true; }
    else if(v&&typeof v==='object'){ if(k==='pihak2'&&v.nama) return true; if(k==='pihak1'&&v.nama&&v.nama!==S.user.nama) return true; }
  }
  return false;
}
function simpanDrafSekarang(){
  var f=F; if(!f||f.id||f.sudah||!f.dirty) return Promise.resolve();
  clearTimeout(f.timer);

  if(!adaIsi(k.data)) return Promise.resolve();
  infoDraf('Menyimpan draf…');
  return api('simpanDraf',f.jenis,k.data).then(function(){ infoDraf('Draf tersimpan otomatis ✓'); },function(){ infoDraf('Draf belum tersimpan'); });

async function muatDraf(){

function terapkanDraf(d){

    if(f.t==='petugas'){ F.petugas=d.petugas.slice(); gambarTags(); }
    else if(f.t==='checklist'){ F.checklist=d[f.k].map(function(c){ return {item:c.item,hasil:c.hasil,ket:c.ket||''}; }); gambarCk(); }
    else if(f.t==='orang'){ var o=d[f.k]; if($('f_'+f.k+'_n')){ $('f_'+f.k+'_n').value=o.nama||''; $('f_'+f.k+'_p').value=o.nip||''; $('f_'+f.k+'_j').value=o.jabatan||''; } }

  });

function kumpul(){
  var J=JENIS[F.jenis], d={}, salah=null;
  J.fields.forEach(function(f){
    if(f.t==='foto') return;
    var v;
    if(f.t==='petugas') v=F.petugas.slice();
    else if(f.t==='orang') v={nama:$('f_'+f.k+'_n').value.trim(),nip:$('f_'+f.k+'_p').value.trim(),jabatan:$('f_'+f.k+'_j').value.trim()};
    else if(f.t==='checklist') v=F.checklist.filter(function(c){ return c.item&&c.item.trim(); });
    else v=$('f_'+f.k).value;
    d[f.k]=v;
    if(f.w&&!salah){
      var kosong = f.t==='petugas' ? !v.length : f.t==='orang' ? !v.nama : !String(v).trim();
      if(kosong) salah='Kolom "'+f.l+'" wajib diisi.';

  });
  return {data:d,salah:salah};
}

async function bagikanFile(){

  var a=document.createElement('a'); a.href=h.url; a.download=h.nama; document.body.appendChild(a); a.click(); a.remove();

/* ================= Kirim laporan + foto ke WhatsApp ================= */
function dataUrlKeFile(u,nama){
  var m=/^data:([^;]+);base64,(.*)$/.exec(u); if(!m) throw new Error('Foto tidak terbaca');
  var bin=atob(m[2]), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr],nama,{type:m[1]});
}
async function siapWA(id){
  var x=S.dok[id]; if(!x) return;
  bukaLembar('Menyiapkan…','<div class="kosong"><span class="spin g" style="width:28px;height:28px;border-width:3px"></span><p id="infoSiap">Menyusun PDF laporan…</p></div>');
  try{
    var f=await api('unduhDokumen',id,'pdf');
    var bin=atob(f.base64), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var files=[new File([arr],f.nama,{type:f.mime})];
    var ids=x.fotoIds||[], gagal=0;
    for(var k=0;k<ids.length;k++){
      if($('infoSiap')) $('infoSiap').textContent='Mengambil foto '+(k+1)+' dari '+ids.length+'…';
      try{ files.push(dataUrlKeFile(await api('ambilFoto',ids[k]),'Foto-'+(k+1)+'.jpg')); }catch(e){ gagal++; }
    }
    S.paket={files:files,teks:teksWA(x),nama:f.nama,url:URL.createObjectURL(files[0])};
    bukaLembar('Siap dikirim ✅',
      '<div class="card flat"><div class="judul" style="margin-top:0">'+esc(x.judul)+'</div>'+
      '<div class="meta">'+ic('file',15)+'1 PDF laporan'+(files.length>1?' + '+(files.length-1)+' foto':'')+'</div>'+
      (gagal?'<div class="pesan gagal">'+gagal+' foto gagal dimuat dan tidak ikut terkirim.</div>':'')+'</div>'+
      '<button class="btn wa blok" data-aksi="kirimPaket" style="margin-top:0">'+ic('chat',19)+'Kirim ke WhatsApp</button>'+
      '<div class="hint" style="text-align:center;margin-top:10px">Setelah ditekan, pilih <b>WhatsApp</b> lalu pilih kontak atau grup. PDF dan foto terkirim sekaligus.</div>');
  }catch(e){ bukaLembar('Gagal','<div class="pesan gagal">'+esc(e.message)+'</div>'); }
}
async function kirimPaket(){
  var pk=S.paket; if(!pk) return;
  try{
    if(navigator.canShare&&navigator.canShare({files:pk.files})){ await navigator.share({files:pk.files,text:pk.teks}); return; }
    toast('HP atau browser ini tidak mendukung kirim file langsung. Unduh dulu lalu lampirkan.');
  }catch(e){ if(e&&e.name==='AbortError') return; toast('Gagal membuka WhatsApp: '+(e.message||e)); }
  var a=document.createElement('a'); a.href=pk.url; a.download=pk.nama; document.body.appendChild(a); a.click(); a.remove();
}

function nilaiDetail(f,v){
  if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length)) return '<div class="v kosong2">-</div>';
  if(f.t==='date') return '<div class="v">'+esc(tglIndo(v))+'</div>';
  if(f.t==='time') return '<div class="v">'+esc(jamTitik(v))+'</div>';
  if(f.t==='checklist'&&Array.isArray(v)) return '<div class="rows">'+v.map(function(c){ return '<div><b>'+esc(c.item)+'</b>: '+esc(c.hasil)+(c.ket?'<small>'+esc(c.ket)+'</small>':'')+'</div>'; }).join('')+'</div>';
  if(Array.isArray(v)){
    if(v.length&&typeof v[0]==='object') return '<div class="rows">'+v.map(function(o){ return '<div>'+Object.keys(o).map(function(k){ return esc(o[k]); }).filter(Boolean).join(' — ')+'</div>'; }).join('')+'</div>';
    return '<div class="chips">'+v.map(function(p){ return '<span class="chip">'+esc(p)+'</span>'; }).join('')+'</div>';
  }
  return '<div class="v">'+esc(v)+'</div>';
}

var AKSI={
  segAuth:function(b){ var m=b.dataset.t==='masuk'; $('segMasuk').classList.toggle('on',m); $('segDaftar').classList.toggle('on',!m); $('formMasuk').classList.toggle('hidden',!m); $('formDaftar').classList.toggle('hidden',m); pesanAuth(''); },
  masuk:async function(b){ pesanAuth(''); loading(b,'Masuk…'); try{ var r=await call('masuk',[$('lUser').value,$('lPass').value]); S.token=r.token; S.user=r.user; simpanToken(r.token); $('lPass').value=''; tampilApp(); }catch(e){ pesanAuth(e.message); } selesai(b); },
  daftar:async function(b){ pesanAuth(''); loading(b,'Membuat akun…'); try{ var r=await call('daftar',[{nama:$('rNama').value,nip:$('rNip').value,jabatan:$('rJab').value,username:$('rUser').value,password:$('rPass').value,kode:$('rKode').value}]); S.token=r.token; S.user=r.user; simpanToken(r.token); tampilApp(); toast('Akun dibuat, selamat datang!'); }catch(e){ pesanAuth(e.message); } selesai(b); },
  go:function(b){ go(b.dataset.t); },
  fab:function(){ if(S.tab==='dok') menuBaru(); else formKeg(); },
  baru:function(b){ if(b.dataset.j==='kegiatan') formKeg(); else formDok(b.dataset.j); },
  tutup:tutupLembar,
  fJenis:function(b){ S.fJenis=b.dataset.j; document.querySelectorAll('.fc').forEach(function(c){ c.classList.toggle('on',c.dataset.j===S.fJenis); }); muatDok(); },
  ai:rapikanAI,
  siapWA:function(b){ siapWA(b.dataset.id); },
  kirimPaket:kirimPaket,
  simpanAI:async function(b){ loading(b,'Menyimpan…'); try{ var d={geminiModel:$('sModel').value}; if($('sKunci').value.trim()) d.geminiKey=$('sKunci').value; await api('simpanPengaturan',d); S.set=await api('ambilPengaturan'); pk('pesanAI',true,'Pengaturan AI tersimpan.'); muatAdmin(); }catch(e){ pk('pesanAI',false,e.message); } selesai(b); },
  hapusKunciAI:async function(b){ try{ await api('simpanPengaturan',{hapusGeminiKey:true}); toast('Kunci AI dihapus'); muatAdmin(); }catch(e){ toast(e.message); } },
  detail:function(b){ lihatDetail(b.dataset.id); },
  mata:function(b){ var i=b.parentNode.querySelector('input'); var tampil=i.type==='password'; i.type=tampil?'text':'password'; b.innerHTML=ic(tampil?'eyeoff':'eye',20); b.setAttribute('aria-label',tampil?'Sembunyikan password':'Lihat password'); },
  foto:function(b){ lihatFoto(b.dataset.ids.split(',')); },
  bagi:function(b){ menuBagi(b.dataset.id); },
  lihatDaftar:function(){ tutupLembar(); go('dok'); },
  ekspor:function(b){ ekspor(b.dataset.id,b.dataset.fmt); },
  waTeks:function(b){ var x=S.dok[b.dataset.id]; window.open(waLink(teksWA(x)),'_blank'); },
  salin:function(b){
    var teks=teksWA(S.dok[b.dataset.id]);
    bukaLembar('Salin teks laporan','<div class="card flat"><textarea id="teksSalin" style="min-height:280px;font-size:14px" readonly>'+esc(teks)+'</textarea></div>'+
      '<button class="btn blok" data-aksi="salinSekarang" style="margin-top:0">'+ic('copy',18)+'Salin teks</button>'+
      '<a class="btn wa blok" href="'+esc(waLink(teks))+'" target="_blank" rel="noopener">'+ic('chat',18)+'Kirim ke WhatsApp</a>'+
      '<div class="hint" style="text-align:center;margin-top:10px">Kalau tombol Salin tidak berhasil, tahan lama di teks di atas, pilih Pilih Semua, lalu Salin.</div>');
  },
  salinSekarang:function(){
    var t=$('teksSalin'); if(!t) return;
    t.focus(); t.select(); try{ t.setSelectionRange(0,t.value.length); }catch(e){}
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    if(ok){ toast('Teks disalin 📋'); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t.value).then(function(){ toast('Teks disalin 📋'); },function(){ toast('Tahan teks lalu pilih Salin'); }); }
    else toast('Tahan teks lalu pilih Salin');
  },
  bagikanFile:bagikanFile,
  menuDok:function(b){
    var id=b.dataset.id;
    bukaLembar('Kelola laporan','<button class="mi" data-aksi="ubahDok" data-id="'+id+'"><div class="ik" style="background:#1d4ba3">'+ic('edit',20)+'</div><div><b>Ubah laporan</b><span>Edit isi, tambah atau ganti foto</span></div></button>'+
      '<button class="mi" data-aksi="hapusDok" data-id="'+id+'"><div class="ik" style="background:#c0362c">'+ic('trash',20)+'</div><div><b>Hapus laporan</b><span>Tidak bisa dibatalkan</span></div></button>');
  },
  ubahDok:function(b){ var x=S.dok[b.dataset.id]; tutupLembar(); formDok(x.jenis,x); },
  hapusDok:async function(b){
    if(!b.dataset.sure){ b.dataset.sure='1'; b.querySelector('b').textContent='Tekan lagi untuk menghapus'; return; }
    try{ await api('hapusDokumen',b.dataset.id); tutupLembar(); toast('Laporan dihapus'); if(S.tab==='dok') muatDok(); else halHome(); }catch(e){ toast(e.message); }
  },
  tambahPetugas:tambahPetugas,
  hapusPetugas:function(b){ F.petugas.splice(Number(b.dataset.i),1); gambarTags(); },
  ckTambah:function(){ F.checklist.push({item:'',hasil:'Baik',ket:''}); gambarCk(); },
  ckHapus:function(b){ F.checklist.splice(Number(b.dataset.i),1); gambarCk(); },
  ckContoh:function(){ var kat=$('f_kategori')?$('f_kategori').value:'CCTV'; var p=PRESET[kat]||[]; F.checklist=p.map(function(i){ return {item:i,hasil:'Baik',ket:''}; }); gambarCk(); },
  simpanDok:simpanDok,
  simpanKeg:simpanKeg,
  ubahKeg:function(b){ formUbahKeg(b.dataset.id); },
  simpanUbahKeg:simpanUbahKeg,
  simpanProfil:async function(b){ loading(b,'Menyimpan…'); try{ S.user=await api('perbaruiProfil',{nama:$('pNama').value,nip:$('pNip').value,jabatan:$('pJab').value}); $('avatar').textContent=S.user.nama.charAt(0).toUpperCase(); pk('pesanProfil',true,'Profil tersimpan.'); }catch(e){ pk('pesanProfil',false,e.message); } selesai(b); },
  gantiPw:async function(b){ loading(b,'Menyimpan…'); try{ await api('gantiPassword',$('pwLama').value,$('pwBaru').value); $('pwLama').value=''; $('pwBaru').value=''; pk('pesanPw',true,'Password diganti.'); }catch(e){ pk('pesanPw',false,e.message); } selesai(b); },
  simpanSet:async function(b){ loading(b,'Menyimpan…'); try{ await api('simpanPengaturan',{kepada:$('sKepada').value,jabatanTtd:$('sJab').value,namaTtd:$('sNama').value,zona:$('sZona').value,nomorWa:$('sWa').value}); S.set=await api('ambilPengaturan'); pk('pesanSet',true,'Pengaturan tersimpan. Berlaku di dokumen berikutnya.'); }catch(e){ pk('pesanSet',false,e.message); } selesai(b); },
  gantiKode:async function(b){ loading(b,'…'); try{ var k=await api('gantiKodeDaftar'); $('kodeDaftar').textContent=k; toast('Kode baru dibuat'); }catch(e){ toast(e.message); } selesai(b); },
  peran:async function(b){ loading(b,'…'); try{ await api('ubahPeran',b.dataset.id,b.dataset.peran); muatAdmin(); }catch(e){ toast(e.message); selesai(b); } },
  resetForm:resetForm,
  menuReset:function(){
    var cb=function(v,t,sub){ return '<label class="cb"><input type="checkbox" value="'+v+'"><span>'+esc(t)+(sub?'<br><small style="font-weight:400;color:var(--mut)">'+esc(sub)+'</small>':'')+'</span></label>'; };
    bukaLembar('Reset data',
      '<div class="pesan gagal" style="margin:0 0 12px">Data yang dihapus <b>tidak bisa dikembalikan</b>. Foto di Google Drive tidak ikut terhapus.</div>'+
      cb('draf','Draf yang belum disimpan','Isian formulir yang tersimpan otomatis')+
      URUT.map(function(k){ return cb('lap_'+k,'Laporan '+JENIS[k].nama); }).join('')+
      cb('kegiatan','Kegiatan harian')+
      (S.user.peran==='admin'?'<label class="cb" style="border-color:var(--bad)"><input type="checkbox" id="rSemua"><span>Berlaku untuk <b>semua petugas</b><br><small style="font-weight:400;color:var(--mut)">Kalau tidak dicentang, hanya data milik saya yang dihapus</small></span></label>':'')+
      '<label>Ketik <b>RESET</b> untuk konfirmasi</label><input id="rKonf" autocapitalize="characters" placeholder="RESET">'+
      '<button class="btn danger blok" data-aksi="jalankanReset">Reset yang dipilih</button><div class="pesan gagal hidden" id="pesanReset"></div>');
  },
  jalankanReset:async function(b){
    var pil=[].slice.call(document.querySelectorAll('#ls .cb input[type=checkbox]')).filter(function(c){ return c.checked&&c.value; }).map(function(c){ return c.value; });
    var pe=$('pesanReset'); pe.classList.add('hidden');
    if(!pil.length){ pe.textContent='Pilih dulu yang mau di-reset.'; pe.classList.remove('hidden'); return; }
    if($('rKonf').value.trim().toUpperCase()!=='RESET'){ pe.textContent='Ketik RESET untuk konfirmasi.'; pe.classList.remove('hidden'); return; }
    loading(b,'Menghapus…');
    try{
      var r=await api('resetData',pil,!!($('rSemua')&&$('rSemua').checked));
      tutupLembar(); toast('Selesai: '+r.laporan+' laporan, '+r.kegiatan+' kegiatan, '+r.draf+' draf dihapus');
      if(S.tab==='home') halHome(); else if(S.tab==='dok') muatDok(); else if(S.tab==='keg') muatKeg();
    }catch(e){ selesai(b); pe.textContent=e.message; pe.classList.remove('hidden'); }
  },
  keluar:async function(){ try{ await api('keluar'); }catch(e){} keluarLokal(); }
};
function menuBaru(){
  bukaLembar('Buat laporan apa?',URUT.map(function(k){ var J=JENIS[k];
    return '<button class="mi" data-aksi="baru" data-j="'+k+'"><div class="ik" style="background:'+J.warna+'">'+ic(J.ik,20)+'</div><div><b>'+esc(J.judul)+'</b><span>'+esc(J.ket)+'</span></div></button>'; }).join(''));
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-aksi]'); if(!b||b.disabled) return;
  var f=AKSI[b.dataset.aksi];
  if(f){ if(b.dataset.aksi==='baru'&&!$('lembar').classList.contains('hidden')) tutupLembar(); f(b); }
});
['lUser','lPass'].forEach(function(id){ $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') AKSI.masuk($('btnMasuk')); }); });
boot();
</script>
</body>
</html>
